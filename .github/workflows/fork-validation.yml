name: Fork validation

on:
  push:
    branches: [performance]
  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: 'true'

concurrency:
  group: fork-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Clang and glslang
        shell: pwsh
        run: |
          Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin' >> $env:GITHUB_PATH
          $zip = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $toolDir = Join-Path $env:RUNNER_TEMP 'glslang'
          Invoke-WebRequest -Uri 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip).Hash -ne '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b') {
            throw 'Unexpected glslang SHA-256.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $toolDir
          $validator = Get-ChildItem -LiteralPath $toolDir -Recurse -File -Filter glslang.exe | Select-Object -First 1
          if (!$validator) { throw 'glslang executable is missing.' }
          $validator.DirectoryName >> $env:GITHUB_PATH
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build and package the Windows emulator
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DKYTY_BUILD_ORIGIN=Fork "-DKYTY_BUILD_REPOSITORY=$env:GITHUB_REPOSITORY" `
            "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR"
          cmake --build _Build/windows --target launcher --parallel 3
          cmake --install _Build/windows --prefix _Build/windows/install
          $helpText = & './_Build/windows/install/kyty_emulator.exe' --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch '--benchmark-output') {
            throw 'Benchmark CLI is missing from the installed emulator.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: KytyPs5-GTA-VI-Windows
          path: _Build/windows/install/
          if-no-files-found: error
      - name: Build Windows Vulkan and archive tests
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build _Build/windows --target shader_recompiler_compute_tests archive_file_tests --parallel 3
      - uses: actions/upload-artifact@v4
        with:
          name: KytyPs5-GTA-VI-Windows-Vulkan-tests
          path: |
            _Build/windows/shader_recompiler_compute_tests.exe
            _Build/windows/archive_file_tests.exe
            _Build/windows/libwinpthread-1.dll
          if-no-files-found: error
      - name: Run Windows host regression tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build _Build/windows --target kyty_tests --parallel 3
          ctest --test-dir _Build/windows --output-on-failure --timeout 480 -LE hardware_vulkan

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang lld ninja-build glslang-tools \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev libwayland-dev wayland-protocols mesa-vulkan-drivers
      - name: Configure, build and test
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          cmake -S . -B _Build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DKYTY_BUILD_LAUNCHER=OFF \
            -DKYTY_BUILD_ORIGIN=Fork "-DKYTY_BUILD_REPOSITORY=$GITHUB_REPOSITORY"
          cmake --build _Build/linux --target kyty_emulator --parallel 4
          emulator="$(find _Build/linux -type f -name kyty_emulator -print -quit)"
          "$emulator" --help > _Build/linux/emulator-help.txt
          grep -F -- '--benchmark-output' _Build/linux/emulator-help.txt
          cmake --build _Build/linux --target kyty_tests --parallel 4
          ctest --test-dir _Build/linux --output-on-failure --timeout 480 -LE hardware_vulkan
